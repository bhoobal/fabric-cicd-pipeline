# environments.yml
# One entry per environment. Replace every placeholder GUID/name before running.
# principal_type must be one of: User | Group | ServicePrincipal
# role must be one of: Admin | Member | Contributor | Viewer

environments:
  dev:
    fabric_environment_key: "DEV"          # must match a key in workspace/parameter.yml
    workspace_name: "WS-SalesAnalytics-Dev"
    description: "Sales Analytics domain - Development"
    capacity_id: "00000000-0000-0000-0000-000000000001"
    rbac:
      - principal_id: "00000000-0000-0000-0000-0000000000d1"   # sp-fabric-salesanalytics-dev
        principal_type: "ServicePrincipal"
        role: "Contributor"
      - principal_id: "00000000-0000-0000-0000-0000000000d2"   # SG-Fabric-SalesAnalytics-Dev (analysts)
        principal_type: "Group"
        role: "Member"
    git:
      connect: true                        # only Dev is Git-connected - Test/Prod stay pipeline-only
      owner_name: "your-org-name"
      repository_name: "fabric-sales-analytics"
      branch_name: "main"
      directory_name: "/workspace"
      initialization_strategy: "PreferRemote"

  test:
    fabric_environment_key: "TEST"
    workspace_name: "WS-SalesAnalytics-Test"
    description: "Sales Analytics domain - Test/UAT"
    capacity_id: "00000000-0000-0000-0000-000000000002"
    rbac:
      - principal_id: "00000000-0000-0000-0000-0000000000t1"   # sp-fabric-salesanalytics-test
        principal_type: "ServicePrincipal"
        role: "Contributor"
      - principal_id: "00000000-0000-0000-0000-0000000000t2"   # SG-Fabric-SalesAnalytics-Test (reviewers)
        principal_type: "Group"
        role: "Viewer"
    git:
      connect: false

  prod:
    fabric_environment_key: "PROD"
    workspace_name: "WS-SalesAnalytics-Prod"
    description: "Sales Analytics domain - Production"
    capacity_id: "00000000-0000-0000-0000-000000000003"
    rbac:
      - principal_id: "00000000-0000-0000-0000-0000000000p1"   # sp-fabric-salesanalytics-prod
        principal_type: "ServicePrincipal"
        role: "Contributor"
      - principal_id: "00000000-0000-0000-0000-0000000000p2"   # SG-Fabric-SalesAnalytics-Prod (viewers only)
        principal_type: "Group"
        role: "Viewer"
    git:
      connect: false
